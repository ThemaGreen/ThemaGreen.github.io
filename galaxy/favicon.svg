<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#142033"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="55%" stop-color="#FFC95B"/>
      <stop offset="100%" stop-color="#F2A33C"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#140d35"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- sparkles -->
  <circle cx="14" cy="16" r="1" fill="#cfe0ff"/>
  <circle cx="50" cy="14" r="1.3" fill="#fff"/>
  <circle cx="52" cy="44" r="1" fill="#9fd8ff"/>
  <circle cx="12" cy="46" r="1.1" fill="#fff"/>
  <!-- star with a galaxy-lens heart -->
  <g filter="url(#glow)">
    <path fill="url(#star)" stroke="#E0875F" stroke-width="1" stroke-linejoin="round"
      d="M32 8 L39 27 L59 27 L43 39 L49 58 L32 46 L15 58 L21 39 L5 27 L25 27 Z"/>
    <circle cx="32" cy="33" r="8.5" fill="#120c30"/>
    <circle cx="32" cy="33" r="6.5" fill="url(#lens)"/>
    <circle cx="32" cy="33" r="1.8" fill="#fff"/>
  </g>
</svg>
