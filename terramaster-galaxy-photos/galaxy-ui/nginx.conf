# Template — nginx entrypoint substitutes ${IMMICH_URL}.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA (client-side routing fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the Immich API. Phase 2: NO server-side admin key — each
    # user authenticates as themselves (Bearer token + Immich session cookie),
    # so the site never exposes one person's library to everyone. We just pass
    # the user's own Authorization/Cookie through to Immich (under /api/).
    location /immich/ {
        proxy_pass ${IMMICH_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        # pass through Range requests so video playback / seeking works
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }
}
