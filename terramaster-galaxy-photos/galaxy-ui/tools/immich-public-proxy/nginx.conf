# ============================================================================
#  Hardened public proxy for Immich (sits between Tailscale Funnel and Immich)
#
#  Chain:  Internet → Tailscale Funnel (TLS at Tailscale's edge)
#                   → this nginx (published on 127.0.0.1:8080 of the NAS only)
#                   → Immich (immich_server:2283 on the docker network)
#
#  What it enforces:
#    • CORS locked to https://themagreen.com ONLY (no wildcard)
#    • Login brute-force rate limit (5 attempts/min per IP + tiny burst)
#    • General API rate limit (per-IP ceiling)
#    • Admin routes return 403 — unreachable from the public path
#    • Security headers; no server version disclosure
#
#  See docs/public-immich-hardened.md for the full setup runbook.
# ============================================================================

worker_processes 1;
events { worker_connections 512; }

http {
  map $http_x_forwarded_for $client_ip {
    default $http_x_forwarded_for;
    ""      $remote_addr;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  map $http_origin $cors_origin {
    default                      "";
    "https://themagreen.com"     $http_origin;
    "https://www.themagreen.com" $http_origin;
  }

  limit_req_zone $client_ip zone=login:10m rate=5r/m;
  limit_req_zone $client_ip zone=api:10m   rate=20r/s;
  limit_req_status 429;

  server_tokens off;
  client_max_body_size 512m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  send_timeout 600s;

  server {
    listen 8089;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/api/admin { return 403; }

    location = /api/auth/login {
      limit_req zone=login burst=3 nodelay;
      include /etc/nginx/includes/cors.inc;
      proxy_pass http://immich_server:2283;
      include /etc/nginx/includes/proxy.inc;
    }

    location / {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/includes/cors.inc;
      proxy_pass http://immich_server:2283;
      include /etc/nginx/includes/proxy.inc;
    }
  }
}
